# SpatiQuake in spatiand-host's catalogue (~/.config/spatiand-host/apps.toml), streamed to the
# glasses as the room. add-to-host.sh writes this with the real paths. Spatiand's OpenXR runtime
# must be installed on the host (tools/install-openxr.sh in the spatiand repository).
[[app]]
id = "spatiquake"
name = "SpatiQuake"
icon = "RELEASE/spatiquake.png"
exec = "RELEASE/spatiquake.sh"
args = ["-xr"]
env = [["XR_RUNTIME_JSON", "HOME/.local/share/spatiand-openxr/spatiand_openxr.json"]]
kind = "vr"
eyes = "side_by_side"
