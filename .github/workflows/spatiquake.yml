name: SpatiQuake

# vkQuake built natively on Linux with meson, then started with LibreQuake's data on Mesa's
# software Vulkan (lavapipe) under Xvfb: once to the menu and once into a map, each ending in a
# screenshot that is kept as an artifact. (Upstream's AppImage build stays in build-linux.yml.)

on: [push, pull_request, workflow_dispatch]

# One at a time per branch: a newer push waits for the one running (which may be building and
# caching LibreQuake's data) rather than building the same data beside it.
concurrency:
  group: spatiquake-${{ github.ref }}
  cancel-in-progress: false

env:
  VULKAN_SDK_VER: 1.4.341.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev libvorbis-dev libmpg123-dev libflac-dev \
          libopusfile-dev libopenxr-dev
    # The parts of the Vulkan SDK the build uses: newer headers and a spirv-opt with
    # --canonicalize-ids (Ubuntu's are too old), as upstream's AppImage image does.
    # Kept between runs; when fetched, retried (LunarG's server has dropped the connection mid-way).
    - uses: actions/cache@v4
      with:
        path: ~/vulkan-sdk.tar.xz
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}
    - name: Vulkan SDK
      run: |
        mkdir -p "$HOME/vulkan-sdk"
        if ! xz -t "$HOME/vulkan-sdk.tar.xz" 2>/dev/null; then
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$HOME/vulkan-sdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VER/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VER.tar.xz"
        fi
        tar -xJf "$HOME/vulkan-sdk.tar.xz" -C "$HOME/vulkan-sdk" --strip-components=1 --wildcards \
            "$VULKAN_SDK_VER/x86_64/bin/glslang*" "$VULKAN_SDK_VER/x86_64/bin/spirv-opt" \
            "$VULKAN_SDK_VER/x86_64/include" "$VULKAN_SDK_VER/x86_64/lib/libvulkan.so*"
        sdk="$HOME/vulkan-sdk/x86_64"
        mkdir -p "$sdk/lib/pkgconfig"
        printf 'Name: vulkan\nDescription: Vulkan SDK\nVersion: %s\nLibs: -L%s/lib -lvulkan\nCflags: -I%s/include\n' \
          "${VULKAN_SDK_VER%.*}" "$sdk" "$sdk" > "$sdk/lib/pkgconfig/vulkan.pc"
        echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
        echo "$sdk/bin" >> "$GITHUB_PATH"
        echo "PKG_CONFIG_PATH=$sdk/lib/pkgconfig" >> "$GITHUB_ENV"
    - name: Build
      run: meson setup build && ninja -C build
    - uses: actions/upload-artifact@v7
      with:
        name: spatiquake-linux
        path: build/vkquake

  data:
    uses: ./.github/workflows/librequake.yml

  run:
    needs: [build, data]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb mesa-vulkan-drivers libsdl2-2.0-0 libvorbisfile3 libmpg123-0t64 \
          libflac12t64 libopusfile0 libopenxr-loader1
    - uses: actions/download-artifact@v8
      with:
        name: spatiquake-linux
        path: build
    - uses: actions/download-artifact@v8
      with:
        name: librequake-id1
        path: game/id1
    - name: To the menu
      run: chmod +x build/vkquake && spatiquake/tools/smoke-test.sh build/vkquake game shots/menu.png
    - name: Into a map
      # Frames while the map loads go by at the engine's own pace, with nothing drawn: enough of
      # them that there are frames drawn in the map after.
      run: FRAMES=300 MAP=lq_e1m1 spatiquake/tools/smoke-test.sh build/vkquake game shots/e1m1.png
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: screenshots
        path: shots
    - name: Screenshots to the ci-screenshots branch
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: spatiquake/tools/publish-screenshots.sh shots run

  # The OpenXR mode against Spatiand's own runtime (built from peprasetya/spatiand), with no
  # compositor: the session, swapchains, frame loop, layers and actions are all checked by the
  # runtime, and the pictures each eye and the 2D layer were drawn into are kept.
  xr:
    needs: [build, data]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb mesa-vulkan-drivers libsdl2-2.0-0 libvorbisfile3 libmpg123-0t64 \
          libflac12t64 libopusfile0 libopenxr-loader1 libwayland-dev pkg-config
    - uses: actions/checkout@v6
      with:
        repository: peprasetya/spatiand
        path: spatiand
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          spatiand/target
        key: spatiand-openxr-${{ hashFiles('spatiand/Cargo.lock') }}
    - name: Spatiand's OpenXR runtime
      run: |
        cd spatiand
        cargo build --release -p spatiand-openxr
        tools/install-openxr.sh
    - uses: actions/download-artifact@v8
      with:
        name: spatiquake-linux
        path: build
    - uses: actions/download-artifact@v8
      with:
        name: librequake-id1
        path: game/id1
    - name: The eyes and the 2D, in a map
      run: |
        chmod +x build/vkquake
        export XR_RUNTIME_JSON=$HOME/.local/share/spatiand-openxr/spatiand_openxr.json SPATIAND_OPENXR_STDERR=1
        MAP=lq_e1m1 SHOT=xr_screenshot FRAMES=120 spatiquake/tools/smoke-test.sh build/vkquake game shots/xr.png -xr
        grep -E "OpenXR: .*failed" shots/xr.log && exit 1 || true
    # Diagnostic: the 2D layer's alpha where nothing is drawn (should be 0), with each suspect off.
    - name: The 2D layer's empty alpha, setting by setting
      continue-on-error: true
      run: |
        export XR_RUNTIME_JSON=$HOME/.local/share/spatiand-openxr/spatiand_openxr.json
        for setting in "" "vid_fsaa 0" "r_oit 0" "r_ssao 0" "scr_sbaralpha 1" "gl_polyblend 0" "r_oit 0;vid_fsaa 0;r_ssao 0"; do
          name="$(echo "${setting:-default}" | tr ' ;' '_-')"
          args=()
          IFS=';' read -ra parts <<< "$setting"
          for part in "${parts[@]}"; do read -ra kv <<< "$part"; args+=("+${kv[0]}" "${kv[1]}"); done
          MAP=lq_e1m1 SHOT=xr_screenshot FRAMES=60 spatiquake/tools/smoke-test.sh build/vkquake game "shots/alpha/$name.png" -xr "${args[@]}" >/dev/null 2>&1 || true
          a="$(convert "shots/alpha/$name-2d.png" -format '%[fx:p{960,300}.a]' info: 2>/dev/null || echo none)"
          echo "$name: alpha at the centre = $a" | tee -a shots/alpha/summary.txt
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: xr-screenshots
        path: shots
    - name: Screenshots to the ci-screenshots branch
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: spatiquake/tools/publish-screenshots.sh shots xr

  # The release: SpatiQuake as a Spatiand application, SpatiQuake-<version>.spatiapp (dropped into
  # the room, Spatiand offers to install it). The engine is built on Ubuntu 22.04 in upstream's
  # build image, so it runs on SteamOS, and shipped as a plain folder with the libraries it needs
  # (the OpenXR loader among them) beside it; LibreQuake's data with it. Attached to the GitHub
  # release when a v* tag is pushed.
  release:
    needs: data
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Version
      id: version
      run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: Packaging/AppImage/docker
        platforms: linux/amd64
        tags: build-vkquake
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha
    - name: The engine and its libraries
      run: docker run --rm --privileged -v "$PWD:/usr/src/vkQuake" build-vkquake /usr/src/vkQuake/spatiquake/tools/build-appdir-in-docker.sh
    - uses: actions/download-artifact@v8
      with:
        name: librequake-id1
        path: game/id1
    - name: The package
      run: |
        sudo chown -R "$(id -u)" build
        VERSION=${{ steps.version.outputs.version }} spatiquake/tools/make-release.sh build/AppDir game/id1 dist
    - uses: actions/upload-artifact@v7
      with:
        name: spatiquake-spatiapp
        path: dist/*.spatiapp
    - uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: dist/*.spatiapp
